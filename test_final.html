<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#1351B4" />
  <title>TESTE — Final do Jogo: O Dia do Pagamento SEMAE</title>
  <style>
    :root {
      --semae-azul: #1351B4;
      --semae-azul-escuro: #0C326F;
      --semae-verde: #168821;
      --semae-destaque: #FFCD07;
      --semae-fundo: #092040;
      --painel: rgba(255, 255, 255, 0.97);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: var(--semae-fundo); font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: #17324d; user-select: none;
    }
    body { position: fixed; inset: 0; }
    .app, .jogo-wrap {
      position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh;
      overflow: hidden; background: linear-gradient(180deg, #f97316 0%, #fef08a 100%);
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
    .overlay {
      position: absolute; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px;
      background: linear-gradient(rgba(9, 32, 64, 0.70), rgba(9, 32, 64, 0.88));
      backdrop-filter: blur(5px);
    }
    .overlay[hidden] { display: none; }
    .modal {
      width: min(100%, 460px); padding: 24px; border: 2px solid rgba(255, 255, 255, 0.88);
      border-radius: 24px; background: var(--painel); text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.42);
    }
    .modal h2 { margin: 0 0 6px; color: var(--semae-azul-escuro); font-size: 1.5rem; }
    .modal p { margin: 8px 0; font-size: 0.95rem; line-height: 1.35; color: #233e5c; }
    .botao {
      width: 100%; min-height: 54px; border: 0; border-radius: 16px; padding: 12px 18px;
      background: var(--semae-destaque); color: #3b2b00; font-size: 1.05rem; font-weight: 1000;
      cursor: pointer; box-shadow: 0 5px 0 #d9a800; margin-top: 14px;
    }
    .botao:active { box-shadow: 0 2px 0 #d9a800; transform: translateY(3px); }
  </style>
</head>
<body>
<main class="app">
  <section class="jogo-wrap">
    <canvas id="game" width="540" height="960"></canvas>
    <div class="overlay" id="overlay">
      <div class="modal">
        <h2>🎬 TESTE DO FINAL DO JOGO</h2>
        <p><b>“O DIA DO PAGAMENTO NO SEMAE”</b><br>Assista à animação do leiturista recebendo seu salário e bônus, comprando ração e adotando o cachorro!</p>
        <button class="botao" id="startBtn" type="button">▶ ASSISTIR AO FINAL DO JOGO NOW</button>
      </div>
    </div>
  </section>
</main>

<script>
(() => {
  'use strict';
  const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay'), startBtn = document.getElementById('startBtn');

  let W = 540, H = 960, groundY = Math.round(H * 0.79);
  const state = { running: false, time: 0, kombiState: 'grand_finale', finaleTimer: 0, bgOffset: 0, roadOffset: 0 };
  const player = { x: -60, y: groundY - 78, w: 45, h: 78, legPhase: 0, visible: true, onGround: true, landSquash: 0, vy: 0, hurt: 0 };
  const dog = { x: -130, y: groundY - 48, w: 75, h: 48, legPhase: 0, visible: true, lungeOffset: 0, bark: 0 };
  let particles = [], floaters = [];
  let banner = { text: '', sub: '', life: 0, max: 0, kind: 'normal' };

  function showBanner(text, sub = '', life = 180, kind = 'normal') { banner = { text, sub, life, max: life, kind }; }
  function rounded(x, y, w, h, r, fill) {
    r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
  }

  function resizeCanvas() {
    const r = canvas.getBoundingClientRect(); if (!r.width || !r.height) return;
    H = 960; W = Math.max(360, Math.round(H * (r.width / r.height))); groundY = Math.round(H * 0.79);
    canvas.width = W; canvas.height = H;
  }

  function triggerGrandFinale() {
    state.running = true; state.kombiState = 'grand_finale'; state.finaleTimer = 0;
    player.visible = true; player.x = -60; player.y = groundY - player.h;
    dog.visible = true; dog.x = -130; dog.y = groundY - dog.h;
    overlay.hidden = true;
    showBanner('💰 O DIA DO PAGAMENTO NO SEMAE!', 'Você recebeu seu salário e bônus de produtividade!', 240, 'victory');
  }

  function update(dt) {
    if (!state.running) return;
    const step = Math.min(2.2, dt / 16.6667 || 1); state.time += step;
    state.finaleTimer += step;

    if (state.finaleTimer < 160) {
      if (player.x < W * 0.28) { player.x += 2.2 * step; player.legPhase += 0.22 * step; }
      if (dog.x < W * 0.52) { dog.x += 3.0 * step; dog.legPhase += 0.25 * step; }
    } else if (state.finaleTimer >= 160 && state.finaleTimer < 320) {
      if (Math.floor(state.finaleTimer) === 160) showBanner('🐶 O CÃO DE GUARDA CHEGOU...', '“Agora ele quer ser seu amigo!”', 180, 'gold');
    } else if (state.finaleTimer >= 320 && state.finaleTimer < 480) {
      if (Math.floor(state.finaleTimer) === 320) showBanner('🥩 SACO DE RAÇÃO COMPRADO!', 'Com o pagamento, você comprou ração para seu novo amigo!', 180, 'power');
    } else if (state.finaleTimer >= 480 && state.finaleTimer < 680) {
      if (Math.floor(state.finaleTimer) === 480) showBanner('🌅 FIM DE JOGO — AMIGOS PARA SEMPRE!', 'Você concluiu todas as rotas do SEMAE Piracicaba!', 220, 'unlock');
      player.x += 2.2 * step; dog.x += 2.2 * step;
      player.legPhase += 0.22 * step; dog.legPhase += 0.25 * step;
    } else if (state.finaleTimer >= 680) {
      state.running = false;
      overlay.hidden = false;
      document.querySelector('.modal h2').textContent = '🏆 JOGO CONCLUÍDO COM SUCESSO!';
      document.querySelector('.modal p').innerHTML = '<b>🥇 TÍTULO CONFERIDO: LEITURISTA MESTRE SEMAE & AMIGO DOS ANIMAIS 🐶❤️</b><br><br>Parabéns! Você assistiu ao teste do final do jogo.';
      startBtn.textContent = '▶ ASSISTIR NOVAMENTE 🔁';
    }

    if (banner.life > 0) banner.life -= step;
  }

  function drawBackground() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#f97316'); g.addColorStop(1, '#fef08a');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255, 233, 168, 0.35)'; ctx.beginPath(); ctx.arc(W * 0.75, 130, 80, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#FFCD07'; ctx.beginPath(); ctx.arc(W * 0.75, 130, 48, 0, Math.PI * 2); ctx.fill();

    rounded(W * 0.1, groundY - 160, 240, 160, 8, '#0C326F');
    ctx.fillStyle = '#FFCD07'; ctx.fillRect(W * 0.1 + 10, groundY - 145, 220, 26);
    ctx.fillStyle = '#0C326F'; ctx.font = '900 12px system-ui'; ctx.textAlign = 'center'; ctx.fillText('SEMAE — TESOURARIA E PAGAMENTO', W * 0.1 + 120, groundY - 128);
    rounded(W * 0.1 + 95, groundY - 80, 50, 80, 4, '#1e293b');

    if (state.finaleTimer >= 160 && state.finaleTimer < 480) {
      ctx.fillStyle = '#168821'; rounded(W * 0.42, groundY - 55, 45, 55, 6, '#168821');
      ctx.fillStyle = '#FFCD07'; ctx.font = '900 10px system-ui'; ctx.textAlign = 'center'; ctx.fillText('🥩 RAÇÃO', W * 0.42 + 22, groundY - 32);
      ctx.fillText('15 KG', W * 0.42 + 22, groundY - 18);
    }

    ctx.fillStyle = '#dbe5eb'; ctx.fillRect(0, groundY - 14, W, 54);
    ctx.fillStyle = '#a6b7be'; ctx.fillRect(0, groundY + 31, W, 9);
    ctx.fillStyle = '#3a4750'; ctx.fillRect(0, groundY + 40, W, H - groundY - 40);
  }

  function drawDog() {
    if (!dog.visible) return;
    const x = dog.x, y = dog.y + Math.sin(dog.legPhase) * 2;
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; ctx.beginPath(); ctx.ellipse(36, 46, 36, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d9822b'; ctx.beginPath(); ctx.ellipse(34, 25, 30, 18, -0.05, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f7e5c8'; ctx.beginPath(); ctx.ellipse(44, 29, 16, 11, 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d9822b'; ctx.beginPath(); ctx.arc(60, 16, 16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f7e5c8'; ctx.beginPath(); ctx.ellipse(71, 20, 11, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1e1b18'; ctx.beginPath(); ctx.arc(79, 17, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#b86217'; ctx.beginPath(); ctx.moveTo(50, 4); ctx.lineTo(54, -10); ctx.lineTo(66, 4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#1351B4'; ctx.fillRect(48, 24, 8, 12);
    ctx.strokeStyle = '#d9822b'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(6, 18); ctx.quadraticCurveTo(-14, 2 + Math.sin(dog.legPhase * 1.5) * 6, -4, -6); ctx.stroke();

    if (state.finaleTimer >= 160) {
      ctx.fillStyle = '#FF4D6D'; ctx.font = '16px system-ui'; ctx.fillText('❤️', 55, -8);
    }
    ctx.restore();
  }

  function drawPlayer() {
    if (!player.visible) return;
    const x = player.x, y = player.y + Math.sin(player.legPhase * 2) * 2.2;
    ctx.save(); ctx.translate(x, y);
    rounded(6, 20, 37, 42, 9, '#1351B4');
    ctx.fillStyle = '#FFCD07'; ctx.fillRect(8, 38, 33, 5);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 8px system-ui'; ctx.fillText('SEMAE', 12, 32);

    if (state.finaleTimer < 320) {
      rounded(48, 32, 22, 16, 3, '#fef08a');
      ctx.strokeStyle = '#ca8a04'; ctx.lineWidth = 1.5; ctx.strokeRect(48, 32, 22, 16);
      ctx.fillStyle = '#168821'; ctx.font = '900 10px system-ui'; ctx.fillText('💰', 51, 44);
    }

    ctx.fillStyle = '#d5a579'; ctx.beginPath(); ctx.arc(24, 10, 15, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#083F73'; ctx.beginPath(); ctx.arc(22, 6, 15, Math.PI, Math.PI * 2); ctx.fill();
    ctx.fillRect(20, 4, 24, 5);
    ctx.restore();
  }

  function drawBanner() {
    if (banner.life <= 0) return;
    ctx.save(); ctx.textAlign = 'center'; ctx.font = '1000 26px system-ui';
    ctx.strokeStyle = 'rgba(12,50,111,0.85)'; ctx.lineWidth = 8; ctx.strokeText(banner.text, W / 2, H * 0.32);
    ctx.fillStyle = '#FFCD07'; ctx.fillText(banner.text, W / 2, H * 0.32);
    if (banner.sub) {
      ctx.font = '900 15px system-ui'; ctx.strokeStyle = 'rgba(12,50,111,0.85)'; ctx.lineWidth = 6; ctx.strokeText(banner.sub, W / 2, H * 0.32 + 32);
      ctx.fillStyle = '#ffffff'; ctx.fillText(banner.sub, W / 2, H * 0.32 + 32);
    }
    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    drawDog();
    drawPlayer();
    drawBanner();
  }

  let lastTs = 0;
  function loop(ts) {
    const dt = lastTs ? ts - lastTs : 16.67; lastTs = ts;
    update(dt); render(); requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', () => { triggerGrandFinale(); });
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
