version: 1
change_sets:
  - id: "CS-2026-001"
    title: "Jogo do Leiturista 3.0 SEMAE — 5 Fases SCI, Kombi Branca e Design System"
    spec: "docs/sdd/especificacao-fonte-v1.1.md"
    requirements:
      - "REQ-01: 5 Fases progressivas com dados reais de rotas do SCI SEMAE Piracicaba"
      - "REQ-02: Cutscenes da Kombi Branca SEMAE desembarcando e embarcando o leiturista no início e fim das fases"
      - "REQ-03: Exibição de nomes de ruas reais e hidrômetros da rota na HUD com transição dinâmica de ruas"
      - "REQ-04: Manutenção estrita da roupa do leiturista em Azul SEMAE com tokens do Sou SEMAE Portal"
      - "REQ-05: Arquitetura de arquivo único HTML5 offline, responsivo e com salvamento assinado via FNV-1a"
    acceptance_criteria:
      - "O jogo executa perfeitamente offline em um único arquivo HTML (index.html)"
      - "Todas as 5 fases possuem nomes de ruas, setores, rotas e hidrômetros reais extraídos do banco SCI"
      - "A Kombi Branca SEMAE realiza animação no início e no final de cada fase"
      - "O leiturista usa o uniforme azul SEMAE padrão"
      - "Validação SDD é 100% aprovada"
    tasks:
      - "TASK-01: Estruturar repositório e governança de agentes/skills"
      - "TASK-02: Desenvolver engine HTML5 canvas com suporte a fases reais SCI"
      - "TASK-03: Implementar rendering e animação da Kombi Branca SEMAE"
      - "TASK-04: Integrar Design System SEMAE e HUD dinâmico de rotas/ruas"
      - "TASK-05: Testar, validar SDD e publicar no GitHub"
    files:
      - path: "index.html"
        ranges:
          - start: 1
            end: 800
      - path: "README.md"
        ranges:
          - start: 1
            end: 150
    evidence:
      - "Validação automatizada scripts/validate_sdd.py"
      - "Repositório GitHub publicamente acessível"

  - id: "CS-2026-002"
    title: "Correção dos 17 Problemas Críticos do Jogo do Leiturista SEMAE (Save, Assinatura SHA-256, Progresso, Física e Desempenho)"
    spec: "docs/sdd/especificacao-fonte-v1.1.md"
    requirements:
      - "REQ-01: 5 Fases progressivas com dados reais de rotas do SCI SEMAE Piracicaba"
      - "REQ-03: Exibição de nomes de ruas reais e hidrômetros da rota na HUD com transição dinâmica de ruas"
      - "REQ-05: Arquitetura de arquivo único HTML5 offline, responsivo e salvamento assinado criptograficamente via SHA-256"
    acceptance_criteria:
      - "Importação de save v1 realiza migração pura sem ler o localStorage"
      - "Salvamento e validação de saves usam resumo criptográfico SHA-256 e campo assinatura"
      - "Sincronização de UI (syncProgressUI) é acionada unificadamente após load/import"
      - "Contagem de conclusão de ruas usa Set individual por índice de rua"
      - "Recorde da fase só é gravado em vitória oficial (phaseVictoryModal)"
      - "Partida em andamento é persistida com checkpoint semântico no save"
      - "Métrica de pulo renomeada para Coleta Aérea / Técnica Aérea e pontuação é não-consumitiva"
      - "Randomização de gameplay utiliza PRNG determinístico por partida (criarPrng)"
      - "Motor de física usa fixed timestep de 1/60s acumulado"
      - "Padrões usam fallback LRU para evitar repetição do mesmo padrão"
      - "Modo leve e pool de partículas para otimização mobile"
      - "Gerenciamento centralizado do ciclo de vida de visibilidade (visibilitychange)"
    tasks:
      - "TASK-01: Implementar assinatura criptográfica SHA-256 e migração pura v1"
      - "TASK-02: Criar syncProgressUI, checkpoint por Set e salvamento de partida em andamento"
      - "TASK-03: Refatorar métrica de leitura e pontuação não-consumitiva com bônus de anomalia"
      - "TASK-04: Implementar PRNG determinístico, fixed timestep, LRU de padrões e pool de partículas"
      - "TASK-05: Adicionar handler de visibilitychange e throttling no HUD da ameaça"
    files:
      - path: "index.html"
        ranges:
          - start: 1
            end: 2890
    evidence:
      - "Validação automatizada scripts/validate_sdd.py"
      - "Validação automatizada scripts/verificar_limite_200_linhas.py"

  - id: "CS-2026-003"
    title: "Jogo do Leiturista v4.0.0 — reescrita modular, nova arte, desempenho, responsividade e correção de defeitos"
    spec: "docs/specs/SPEC-2026-003-leiturista-v4-redesenho.md"
    requirements:
      - "REQ-101: Preservação da v3.4.0 e compatibilidade de saves"
      - "REQ-102: Desempenho (orçamento de pixels, laço por tempo, camadas pré-renderizadas)"
      - "REQ-103: Responsividade em retrato, paisagem e pontos de quebra"
      - "REQ-104: Identidade visual (arte, HUD, telas) com paleta e tipografia da CTI"
      - "REQ-105: Jogabilidade preservada"
      - "REQ-106: Correção de defeitos da v3.4.0"
      - "REQ-107: Persistência segura (validação, migração, exportação/importação)"
      - "REQ-108: Acessibilidade e ajuda com legenda"
      - "REQ-109: Aviso ao Hub na vitória"
      - "REQ-110: Áudio (gesto, compressor, teto de vozes, suspensão)"
      - "REQ-111: Modularidade (200 linhas) e arquivo único autônomo"
      - "REQ-112: Verificabilidade (simulação sem DOM, e2e, mutação)"
    acceptance_criteria:
      - "AC-101: Saves da v3.4.0, v1 e exportados aceitos; adulterados e grandes recusados"
      - "AC-102: Custo por quadro e orçamento de pixels nas 5 telas de referência"
      - "AC-103: Layout íntegro, sem rolagem horizontal, alvos >=44 px em 12 telas"
      - "AC-104: Giro de tela no meio da partida não encerra a partida"
      - "AC-105: Robô conclui as 5 fases; sem entrada perde"
      - "AC-106: Retomada consistente da partida salva"
      - "AC-107: total_hidrometros igual à soma das ruas"
      - "AC-108: Nenhum alert; aviso não bloqueante"
      - "AC-109: Console sem erros em campanha completa"
      - "AC-110: Mensagem SEMAE_FIM_PARTIDA apenas na vitória e para a origem da página"
      - "AC-111: Fontes <=200 linhas e index.html sem requisições externas"
      - "AC-112: Teclado, foco visível e áudio somente após gesto"
    tasks:
      - "TASK-2026-003: Reescrita modular do Jogo do Leiturista (v4.0.0)"
